name: mutants

# This repository is public. Routine trusted pushes mutate their complete diff
# in rust.yml after validation. The exhaustive 1,490-mutant sweep runs weekly
# or by explicit dispatch, and only for the default branch.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 0'

permissions:
  contents: read

concurrency:
  group: mutants-full
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # A full sweep catches coverage weakened by test-only changes outside a
  # production diff. Manual dispatches on any other branch fail closed before
  # consuming the self-hosted runner.
  mutants:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: [self-hosted, linux, x64, homelab-ai-1, drep-mutants]
    # Mutation has its own bounded runner. Validation and release use the separate
    # drep-linux account on homelab-ai-1, so a full sweep cannot occupy their only
    # runner or compete with production workloads.
    timeout-minutes: 420
    steps:
      # cargo-mutants builds every mutant in its own scratch copy of the tree,
      # which excludes target/, so an ordinary clean checkout loses nothing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy

      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: cargo-mutants@27.1.0

      # scripts/mutants-run.sh owns the verdict, including the distinction
      # between a detected timeout and a genuinely missed mutant.
      - run: ./scripts/mutants-run.sh
