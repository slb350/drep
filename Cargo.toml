[package]
name = "drep-ai"
version = "2.6.0"
edition = "2024"
# `ignore` 0.4.30 introduced let-chains that require Rust 1.88 without
# declaring that floor. The current `ignore` now declares 1.88 itself;
# open-agent-sdk asks only for 1.85, but measured 1.86 and 1.87 builds still
# fail with the older release. Pinning `ignore` back would hold the old floor
# at the cost of freezing the file walk.
rust-version = "1.88"
description = "A local commit gate: runs the linters your repo configures, and sends changed code to an LLM for review"
license = "MIT"
repository = "https://github.com/slb350/drep"
homepage = "https://github.com/slb350/drep"
readme = "README.md"
keywords = ["code-review", "linter", "pre-commit", "llm", "static-analysis"]
categories = ["command-line-utilities", "development-tools"]

# `drep` is already taken on crates.io, so the package keeps the `-ai` suffix;
# the binary and the library are both `drep`.
#
# The bin `path` is required because the binary name differs from the package
# name; the lib path is inferred and left implicit.
[[bin]]
name = "drep"
path = "src/main.rs"

[lib]
name = "drep"

# The one place warnings are denied. Previously this lived in RUSTFLAGS in CI
# and in `-- -D warnings` in the pre-commit hook, so a developer's local
# `cargo clippy` disagreed with both by construction - and the MSRV job would
# have reported an ordinary warning as an MSRV violation.
[lints.rust]
warnings = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
# Deterministic tool output parsing and asynchronous process execution.
regex = "1.13"
serde_json = "1.0"
tokio = { version = "1.53", features = ["io-util", "process", "rt-multi-thread", "macros", "time"] }
# File discovery prunes ignored trees during the walk and understands
# .gitignore without stat-ing every entry under them first.
ignore = "0.4"
# The `open-agent-sdk` crate exposes the `open_agent` library used by the HTTP
# review backend.
# 0.9.0 adds the Anthropic `/messages` protocol and makes `temperature`
# omittable, both of which drep requires: `kimi` and `minimax` speak Anthropic,
# and `k3` rejects any temperature at all. 0.10.0 delivers streamed text one
# event per delta instead of one block at the end of the stream; drep
# concatenates every text block it receives, so the assembled response is
# unchanged - see `run_one_query` in src/llm/client/mod.rs.
open-agent-sdk = "0.10.0"
futures = "0.3"
fs2 = "0.4.3"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
toml = "1.1"
blake3 = "1.8"
directories = "6.0"
# Codex reviews run from a fresh private directory containing drep's
# replacement instructions and response schema, with an empty child cwd.
tempfile = "3.27"
# `drep init` reads a pasted API key without echoing it. A key in the
# terminal's scrollback is the one place drep would otherwise leave a credential
# in the clear, having hand-written `Debug` three times to avoid exactly that.
rpassword = "7.5"
# `drep init` asks an endpoint which models it serves, so a model name
# is chosen from what the plan actually includes rather than typed from memory.
# One GET, no streaming and no retry, which is why it does not go through
# open-agent-sdk - that crate owns the completion path and its retry policy.
# Already present transitively via the SDK, so this costs no new build.
reqwest = { version = "0.12", features = ["json", "gzip"] }

# The SDK enables reqwest's default native TLS backend. Only this cross target
# needs to compile OpenSSL rather than discover it in the host's system paths.
[target.'cfg(all(target_os = "linux", target_arch = "aarch64"))'.dependencies]
reqwest = { version = "0.12", features = ["native-tls-vendored"] }

[dev-dependencies]
assert_cmd = "2.2"
wiremock = "0.6"

[profile.release]
lto = true
codegen-units = 1
strip = true
# main.rs turns every error into an ExitCode rather than panicking, so nothing
# depends on unwinding. Measured at -13% binary size with no build-time cost.
panic = "abort"

# The profile a release is built with. `dist init` writes this as `inherits =
# "release"` plus `lto = "thin"`, which is its own build-time default rather
# than a judgement about this crate - and it would revert the fat LTO above for
# the only binaries anyone installs. Adding nothing here is the point: what
# users run is what `cargo build --release` produces.
[profile.dist]
inherits = "release"
