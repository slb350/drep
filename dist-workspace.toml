[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# Which actions to run on pull requests
pr-run-mode = "skip"
# The x86_64 Strix runner cross-builds arm64 Linux. Cargo-dist's generated pip
# fallback is incompatible with Strix's PEP 668-managed Python, so inject the
# pinned native tools before its dependency step; that step then becomes a
# no-op because cargo-zigbuild is already on PATH. Cargo-dist copies this file
# into release.yml, so changing either source requires `dist init`.
github-build-setup = "../build-setup.yml"
# The installers to generate for each app
installers = ["shell", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
# Where to host releases
hosting = "github"
# A GitHub repo to push Homebrew formulas to
tap = "slb350/homebrew-tap"
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# Customize the Homebrew formula name
formula = "drep"
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false

# Linux and global release work stays on the hardened Strix runner. The M1 Mac
# mini builds both Apple targets natively through the macOS SDK, including the
# x86_64 target from its arm64 host.
[dist.github-custom-runners]
aarch64-apple-darwin = "drep-macos"
x86_64-apple-darwin = "drep-macos"
x86_64-unknown-linux-gnu = "drep-linux"
global = "drep-linux"

[dist.github-custom-runners.aarch64-unknown-linux-gnu]
runner = "drep-linux"
host = "x86_64-unknown-linux-gnu"
